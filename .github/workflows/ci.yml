name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: ESM import
        run: node --input-type=module -e "import('./dist/index.js').then((m) => console.log(typeof m.createIikoClient))"

      - name: CommonJS require
        run: node -e "console.log(typeof require('./dist/index.js').createIikoClient)"

      - run: pnpm audit --audit-level=high

  spec-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm iiko:sync
      - name: Fail if the iikoCloud spec changed
        run: git diff --exit-code src/generated
